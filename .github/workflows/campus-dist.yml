name: campus-dist

# Builds the editor for Calliope Campus, which serves it itself under
# /editors/blocks/ on its own origin (calliope-campus docs/editors.md), and
# pushes the build to the `campus-dist` branch: one commit per build of
# `tested-bootloader`, the build output at its root plus CAMPUS-BUILD.json
# naming the source commits (this repo and scratch-vm). Campus pins a commit of
# that branch as its editors/blocks submodule and moves the pin by hand
# ("bump blocks editor"), so nothing built here reaches campus.calliope.cc
# unreviewed.
#
# The build is the one the Pages project makes (`npm ci`, `npm run build`, a
# development build with scratch-vm at the commit package-lock.json pins), with
# CAMPUS_DIST=1 and PUBLIC_PATH (webpack.config.js): assets load from
# /editors/blocks/, and there is no service worker, web app manifest or source
# maps.
#
# The branch only ever grows: Campus release tags pin its older commits, so
# rewriting it would break their builds.

on:
    push:
        branches:
            - tested-bootloader
    workflow_dispatch:

# One build after the other, so every push lands on the branch in order.
concurrency:
    group: campus-dist
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            # package-lock.json resolves scratch-vm over ssh; the repo is public,
            # so fetch it over https instead.
            - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

            # With its install scripts: prepublish fetches the micro:bit hex the
            # build imports (src/generated/microbit-hex-url.cjs).
            - run: npm ci --no-audit --no-fund
              env:
                  CHROMEDRIVER_SKIP_DOWNLOAD: 'true'

            - run: npm run build
              env:
                  CAMPUS_DIST: '1'
                  PUBLIC_PATH: /editors/blocks/
                  CI: 'true'
                  NODE_OPTIONS: --max-old-space-size=6144

            - name: Push the build to campus-dist
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  SOURCE_SHA: ${{ github.sha }}
                  SOURCE_REF: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  short=${SOURCE_SHA:0:7}
                  vm_sha=$(node -p "require('./package-lock.json').packages['node_modules/scratch-vm'].resolved.split('#')[1]")
                  mkdir dist && cd dist
                  git init -q
                  git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
                  if git fetch -q --depth 1 origin campus-dist; then
                    git checkout -q -b campus-dist FETCH_HEAD
                  else
                    git checkout -q --orphan campus-dist
                  fi
                  git rm -rqf --ignore-unmatch .
                  cp -r ../build/. .
                  # Build output, kept byte for byte: no line-ending conversion on checkout.
                  printf '# Build output, kept byte for byte (no line-ending conversion on checkout).\n* -text\n' > .gitattributes
                  printf '{\n  "source": "%s",\n  "branch": "%s",\n  "scratchVm": "%s",\n  "base": "/editors/blocks/",\n  "built": "%s"\n}\n' \
                    "$SOURCE_SHA" "$SOURCE_REF" "$vm_sha" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > CAMPUS-BUILD.json
                  git add -A
                  git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                    commit -q -m "build ${short} from ${SOURCE_REF}" \
                    -m "Source: https://github.com/${REPO}/commit/${SOURCE_SHA}" \
                    -m "scratch-vm: https://github.com/calliope-edu/scratch-vm/commit/${vm_sha}"
                  git push -q origin campus-dist
                  echo "### campus-dist: build ${short} from ${SOURCE_REF} (scratch-vm ${vm_sha:0:7})" >> "$GITHUB_STEP_SUMMARY"
